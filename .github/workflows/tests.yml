name: Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install package and dependencies
        run: |
          python -m pip install uv
          uv sync --all-groups
      - name: Run unit tests
        run: uv run pytest
        # Default addopts exclude live_excel. Live Excel (xlwings/COM) is a
        # manual Windows bank: LIC_DSF_EXCEL=1 uv run pytest -m live_excel
